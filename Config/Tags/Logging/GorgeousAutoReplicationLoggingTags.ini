; Logging contexts owned by this system/subsystem. DevComment supplies Message Log metadata.
; This globally unique filename is an independent Unreal gameplay-tag source.
[/Script/GameplayTags.GameplayTagsList]
GameplayTagList=(Tag="GT.AutoReplication.Beacon.ClientConnected",DevComment="The snapshot beacon host accepted a client actor. The actor name in the log identifies the connection to track from the host.")
GameplayTagList=(Tag="GT.AutoReplication.Beacon.ClientDisconnected",DevComment="The snapshot beacon host is closing a client connection. The leaving beacon releases managed roots and clears its received snapshots.")
GameplayTagList=(Tag="GT.AutoReplication.Beacon.Connected",DevComment="The client completed the snapshot beacon handshake and will claim the configured managed roots so it can track their snapshots.")
GameplayTagList=(Tag="GT.AutoReplication.Beacon.ConnectionFailed",DevComment="The snapshot beacon cleans up managed roots and cached snapshots on connection failure. Check the beacon host address and Online Beacon diagnostics.")
GameplayTagList=(Tag="GT.AutoReplication.Beacon.RootClaimed",DevComment="The beacon records itself as the owner of an explicitly configured root registry. The stable ID distinguishes the claim from other beacon instances.")
GameplayTagList=(Tag="GT.AutoReplication.Coordinator.Graph.ClassMissing",DevComment="The configured Auto Replication graph class could not be resolved during NetDriver initialization. Check the graph class registration and the driver setup.")
GameplayTagList=(Tag="GT.AutoReplication.Coordinator.Graph.Disabled",DevComment="The stream requests Replication Graph support that was omitted from this build. Check target dependencies and the selected backend in the stream configuration.")
GameplayTagList=(Tag="GT.AutoReplication.Coordinator.Graph.IrisConflict",DevComment="An Iris-enabled NetDriver cannot also host the Replication Graph. Select the backend that matches that driver's configuration.")
GameplayTagList=(Tag="GT.AutoReplication.Coordinator.Graph.Missing",DevComment="The stream could not register with a Gorgeous Replication Graph instance. Check the world's NetDriver, graph class and backend settings.")
GameplayTagList=(Tag="GT.AutoReplication.Coordinator.Iris.Disabled",DevComment="The stream requests Iris support that was omitted from this build. Check target dependencies and the selected backend in the stream configuration.")
GameplayTagList=(Tag="GT.AutoReplication.Coordinator.Iris.Missing",DevComment="The stream could not register because the coordinator has no initialized Iris backend for the world. Inspect that world's Iris setup.")
GameplayTagList=(Tag="GT.AutoReplication.Coordinator.RPC.Routed",DevComment="The coordinator found a replication backend that accepted the RPC. Use the logged backend and channel to trace delivery next.")
GameplayTagList=(Tag="GT.AutoReplication.Iris.BuildUnavailable",DevComment="The coordinator cannot initialize Iris because Iris support is absent from the build. Check target dependencies if this project expects to use Iris.")
GameplayTagList=(Tag="GT.AutoReplication.Iris.Dispatch.NoSubscribers",DevComment="The Iris stream has a root network channel with no subscribers. Check channel membership if a particular client should receive the update.")
GameplayTagList=(Tag="GT.AutoReplication.Iris.StreamUpdated",DevComment="The backend dispatched an Iris stream update. Use the stream GUID to correlate it with the configured frequency and scheduling reason.")
GameplayTagList=(Tag="GT.AutoReplication.Iris.Throttled",DevComment="The Iris scheduler is gating stream dispatch by its update intervals. The log identifies the scheduling reason, rate limits and remaining wait.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Execute.NoComponent",DevComment="An incoming RPC explicitly targets an actor component, but none on the owner handled it. Check the component registration and handler for the key.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Execute.NoHandler",DevComment="The receiver found no handler for the RPC among its object variables, components and owner. Check that both peers register matching handlers for the key.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Execute.NoOwnerHandler",DevComment="An incoming RPC targets the owning Gorgeous actor, but its handler could not be found. Check that the owner implements the handler for this key.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Execute.NoVariable",DevComment="The receive path could not resolve the object variable expected to handle the RPC. Check the target's registration and initialization on the receiving peer.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Execute.VariableFailed",DevComment="The receive path found an object variable, but could not execute the RPC handler on it. Check that variable's handler registration and function signature.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Payload.Applied",DevComment="The receiving object variable accepted the property payload. The reported entry key and stream GUID can be matched to the sender's update.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Payload.DeserializeFailed",DevComment="The receiver could not apply the serialized properties to the target variable. Check matching property layouts across peers and inspect serialization diagnostics.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Payload.Empty",DevComment="The incoming envelope contains no serialized properties. Check which fields the sender marks for Auto Replication if the update should carry data.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Payload.ManualNetworking",DevComment="The target variable uses manual networking and ignores automatic property updates. Use its manual network path or check the variable's networking configuration.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Payload.NetworkingDisabled",DevComment="The receive path discards automatic property updates while networking is disabled on the target. Check whether the receiving actor enables networking.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Payload.NoAdditionalData",DevComment="The receiving mixin has no AdditionalData map to look up the entry. Check initialization of the target actor before its first property update.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Payload.NoTarget",DevComment="The entry exists, but its cached, replicated and default values did not resolve to an object variable. Check construction and binding of the receiver's value.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Payload.NotReplicated",DevComment="The incoming key exists on the receiver, but that entry is not marked for replication. Check that both peers use the intended entry configuration.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Payload.Received",DevComment="The incoming envelope reached the receiving mixin. The entry key and property count identify what will be validated and applied.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Payload.UnknownEntry",DevComment="The receiver could not match or initialize the key from the incoming envelope. Check that the actor registers the same entry or that the dynamic entry supplies a usable class.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.Disabled",DevComment="The local mixin rejected an RPC request because networking is disabled on that actor. Check the actor's network settings before queueing the call.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.Dispatched",DevComment="The actor's transporter accepted the queued call. Use the route, target and key in the log to follow it on the receiving peer.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.DispatchedViaRelay",DevComment="The mixin sent its queued RPC through a player relay. Check the logged relay owner to follow the request on the server.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.NoComponent",DevComment="The requested actor-component route has no eligible component target for the key. Check the owner's registered components before sending.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.NoHandler",DevComment="The sending mixin could not select an eligible object variable or owner for this key. Register a matching handler or choose an explicit target kind.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.NoOwner",DevComment="The RPC requires the owning Gorgeous actor as target, but that actor is unavailable. Check that the mixin has been initialized and its owner is still valid.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.NoTransporter",DevComment="The mixin found no network transporter and will execute the RPC locally. If remote delivery was intended, check transporter creation and replication on the owning actor.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.NoVariable",DevComment="The requested object-variable route has no eligible registered variable for the key. Check that the variable is registered before sending.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.Queued",DevComment="The mixin accepted a request into its local RPC queue. Match the key to a later dispatch or routing failure to see what happened.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.Requested",DevComment="An RPC request entered the mixin before validation. The log identifies the key, requested route type and target kind for tracing.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.ResolvedRelay",DevComment="The mixin found a relay candidate on the controller associated with a PlayerState. Use the controller name to trace the actual client-to-server route.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.RPC.RouteFailed",DevComment="The transporter could not route the RPC and the send was abandoned. Check the preceding routing message for the rejected destination or route type.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.SetValue.NoSlot",DevComment="The mixin cannot update a value whose key has no registered replication slot. Check the owner's entry setup or the timing of the write.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Transporter.ClientNoTransporter",DevComment="The client could not find the transporter expected on the actor. Confirm the server creates it and that the actor and transporter replicate to this client.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Transporter.Created",DevComment="The server created and registered the owning actor's transporter. Clients that use this path need to receive it before they can send or receive through it.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Transporter.Deferred",DevComment="Transporter initialization waits for a valid owning actor and world. Check the actor's startup order if networking is still unavailable after initialization.")
GameplayTagList=(Tag="GT.AutoReplication.Mixin.Transporter.NoOwner",DevComment="The mixin resets its cached transporter because no owning actor was supplied. Check which object owns the mixin and when it is initialized.")
GameplayTagList=(Tag="GT.AutoReplication.RPC",DevComment="The RPC responder's readiness update needs a context object in a valid world. Without one, the request cannot record this responder's new state.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Payload.NullObjectReference",DevComment="RPC argument serialization cannot encode a null object property. Check the named argument for an unset reference before issuing the request.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Payload.UnsupportedObjectType",DevComment="RPC object arguments use the Gorgeous Object Variable serialization format. Check the named parameter for a value outside the UGorgeousObjectVariable hierarchy.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.AuthoritativeCorrectionSent",DevComment="The server replied with its own value after rejecting a client write. The correction lets the sender converge back to the authoritative property state.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ClientPropertyReceived",DevComment="The owning client's relay received the property envelope. Use later mixin logs to check whether the destination resolved and accepted it.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ClientPropertyTargetMissing",DevComment="The client's relay could not find the mixin for this property update. Check that the destination actor and its networking state are ready on the receiving client.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ClientPropertyWorldMismatch",DevComment="The client relay discarded a property update aimed at an actor in another world. Check actor selection and world lifetime, especially during PIE or travel.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.PropertyToClient.AuthorityRequired",DevComment="The player relay accepts this client-bound send only from authority. Invoke it on the server for the controller that owns the relay.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.PropertyToClient.Forwarded",DevComment="The authoritative player relay forwarded the property update to its owning client. Follow the same entry key on that client to verify application.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.PropertyToClient.OwnerMissing",DevComment="The client-bound relay has no actor to supply authority and ownership. Check the relay's lifecycle and owning controller before sending.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.PropertyToServer.DeliveredLocally",DevComment="The relay forwarded the property data directly to a mixin in the same server world. This path does not send a network RPC to the server.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.PropertyToServer.Forwarded",DevComment="The client sent its property envelope to the server through the player relay. Server-side access checks still determine whether the update applies.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.PropertyToServer.OwnerMissing",DevComment="The property relay could not route to the server because its owning actor is unavailable. Check that the relay is attached to the correct controller.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ReliableMulticastForwarded",DevComment="The server relay passed a reliable multicast request to the target mixin. Trace that mixin for the subsequent multicast dispatch.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ServerPropertyAccessDenied",DevComment="The relay's server-side policy rejected the sending controller's write. Check entry ownership and write access for that controller.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ServerPropertyReceived",DevComment="The server relay received a client's property envelope. Destination lookup and write authorization happen before the update can apply.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ServerPropertyTargetMissing",DevComment="The server relay could not resolve a destination mixin in its own world. Check the target actor reference and its networking initialization.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ServerReliableReceived",DevComment="The server relay received a reliable RPC envelope. Use the logged key and type to follow destination lookup and dispatch.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ServerReliableTargetMissing",DevComment="The server relay could not find a target mixin for this reliable call. Check the server-side destination and whether its mixin is initialized.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ServerReliableTypeUnsupported",DevComment="The reliable server relay received a route type it does not dispatch. Check the requested RPC route against the channel used to send it.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ServerUnreliableReceived",DevComment="The server relay received an unreliable RPC envelope. Use the logged key and type to follow destination lookup and dispatch.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ServerUnreliableTargetMissing",DevComment="The server relay could not find a target mixin for this unreliable call. Check the server-side destination and whether its mixin is initialized.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ServerUnreliableTypeUnsupported",DevComment="The unreliable server relay received a route type it does not dispatch. Check the requested RPC route against the channel used to send it.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ToServer.DeliveredLocally",DevComment="The relay found its RPC destination on this server and delivered the call locally. Trace the target mixin's handler to verify execution.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ToServer.Forwarded",DevComment="The client sent a queued RPC to the server through its player relay. The reliability flag identifies which server relay endpoint to inspect.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.ToServer.OwnerMissing",DevComment="The relay cannot determine the forwarding context without its owning actor. Check the relay's attachment and controller lifetime.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Relay.UnreliableMulticastForwarded",DevComment="The server relay passed an unreliable multicast request to the target mixin. Trace that mixin for the subsequent multicast dispatch.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Result.TreeReconstructed",DevComment="The server relay rebuilt an Object Variable tree from an RPC response. Use the request GUID to associate this result with the original call.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Timeout",DevComment="The requester reached its deadline before it received a result. Trace the request GUID through routing, handler execution and responder readiness before changing the timeout.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ClientPropertyAccessDenied",DevComment="The server transporter withheld a client-bound property update because the target controller lacks channel access. Check access policy and channel membership.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ClientPropertyAuthorityRequired",DevComment="The transporter cannot forward a property update to a client from a nonauthoritative owner. Check that the forwarding call runs on the server.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ClientPropertyOwnerMissing",DevComment="The transporter had no owning actor for this client-bound property update. Check the transporter attachment and whether the actor is being torn down.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ClientPropertyTargetMissing",DevComment="The transporter could not resolve a client controller for the property update. Check the owner chain and the expected owning connection.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ClientRPCAuthorityRequired",DevComment="Client RPC forwarding requires an authoritative owner. Route the request through the server before targeting a client connection.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ClientRPCOwnerMissing",DevComment="The transporter has no actor to route this client RPC from. Check transporter initialization and the lifetime of its owner.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ClientRPCTargetMissing",DevComment="The transporter could not resolve the target client controller. Check the actor's ownership chain and the connection for the intended recipient.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.MulticastAccessDenied",DevComment="The transporter excluded a controller from a multicast property update under the entry's access policy. Inspect that receiver's channel membership and permissions.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.MulticastAuthorityRequired",DevComment="A multicast property update must be forwarded by an authoritative actor. Check that the route reaches the server before attempting the broadcast.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.MulticastNoSubscribers",DevComment="There are no subscribers on the update's multicast channel. Verify client subscription state if you expected this channel to have recipients.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.OwningMixinMissing",DevComment="The transporter has no bound mixin to route the property update. Check that it was initialized for the actor that owns this entry.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.PropertyDeliveredLocally",DevComment="The transporter is authoritative and applies this server-bound property update locally. Inspect the receiving mixin for the application result.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.PropertyRouteSelected",DevComment="The transporter is resolving a property envelope before forwarding or local application. Compare the logged route type, ownership and local role with the intended destination.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.PropertyRouteUnsupported",DevComment="No property forwarding path handles the requested route type. Check the route enum supplied by the caller.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ServerReliableAccessDenied",DevComment="The server rejected a reliable property write from the sending controller. Check that controller's write access and ownership for the entry.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ServerReliableForwarded",DevComment="The transporter sent the property envelope through the reliable server endpoint. Follow the entry key on the server to see whether it can be applied.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ServerReliableReceived",DevComment="The reliable transport endpoint received the property envelope on the server. Sender permissions are checked before routing it to the mixin.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ServerUnreliableAccessDenied",DevComment="The server rejected an unreliable property write from the sending controller. Check that controller's write access and ownership for the entry.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ServerUnreliableForwarded",DevComment="The transporter sent the property envelope through the unreliable server endpoint. Follow the entry key on the server to confirm receipt.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.ServerUnreliableReceived",DevComment="The unreliable transport endpoint received the property envelope on the server. Sender permissions are checked before routing it to the mixin.")
GameplayTagList=(Tag="GT.AutoReplication.RPC.Transport.TypeUnsupported",DevComment="The RPC transporter cannot dispatch the requested route type. Check that the caller selects a supported server, client or multicast route.")
GameplayTagList=(Tag="GT.AutoReplication.Tests.RPC.ObjectVariableReturnHandled",DevComment="Automation trace for the RPC return handler on an Object Variable. Compare the input, returned value and sequence to verify end-to-end dispatch.")
GameplayTagList=(Tag="GT.AutoReplication.Tests.RPC.RelayReturnHandled",DevComment="Automation trace for the RPC return handler on a player relay component. Compare the input, returned value and sequence with the origin.")
GameplayTagList=(Tag="GT.RuntimeGlobals.AutoReplication.EnqueueFail",DevComment="The public network setter found the mixin but could not queue the change. Check that the key has a registered replication slot on the selected owner.")
GameplayTagList=(Tag="GT.RuntimeGlobals.AutoReplication.EntryMissing",DevComment="With networking disabled, the setter can only update an existing local entry. Check that the key exists in the chosen owner's AdditionalData map.")
GameplayTagList=(Tag="GT.RuntimeGlobals.AutoReplication.NotFound",DevComment="The public getter resolved the owner's mixin but could not read a value for the key. Check entry registration and whether the owner has initialized the value.")
GameplayTagList=(Tag="GT.RuntimeGlobals.AutoReplication.ResolveRead",DevComment="The public getter could not find a mixin for the explicit owner or world context. Supply a valid context for an actor with Auto Replication.")
GameplayTagList=(Tag="GT.RuntimeGlobals.AutoReplication.ResolveWrite",DevComment="The public setter could not find a mixin for the explicit owner or world context. Supply a valid context for an actor with Auto Replication before writing.")
GameplayTagList=(Tag="GT.RuntimeGlobals.AutoReplication.StreamKeyInvalid",DevComment="The stream override was not saved because its entry key is empty. Use the same nonempty key used to register the replication entry.")
