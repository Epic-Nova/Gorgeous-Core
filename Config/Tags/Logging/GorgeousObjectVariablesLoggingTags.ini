; Logging contexts owned by this system/subsystem. DevComment supplies Message Log metadata.
; This globally unique filename is an independent Unreal gameplay-tag source.
[/Script/GameplayTags.GameplayTagsList]
GameplayTagList=(Tag="GT.ObjectVariables.Assignment.ValidationFailed",DevComment="The variable's assignment validator rejected the proposed value before writing it. Check the property's accepted values and the caller's input.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientPoll.AttemptSync",DevComment="The client poll found local changes and is trying to send a batch to the server. A later relay message reports whether it could dispatch.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientPoll.DirtyDetected",DevComment="A polled property differs from its cached replication value. The client adds it to the next outgoing batch.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.BuildPayloadFailed",DevComment="The client stopped before sending because it could not build a property payload. Check the preceding serialization or custom payload messages.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.EmptyPayload",DevComment="None of the properties selected for this update survived payload filtering. Check the replication declarations and conditions on the dirty properties.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.FallbackToLocalPC",DevComment="The PlayerState does not yet have its own controller. The client is using a local PlayerController as the relay during that gap.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.HasAuthority",DevComment="The resolved owner already has authority for the variable, so this client-to-server route is unnecessary.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.NetworkingDisabled",DevComment="The client send path requires both networking support and replication to be enabled for the variable. The message reports the two flags.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.NoDirty",DevComment="No properties were passed to the client send path. A local assignment only needs a send when a replicated property is dirty.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.NoEntryKey",DevComment="The variable has no AutoReplication entry key, so the server cannot identify the destination. Check that the variable has been bound to its owner and registration entry.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.NoLocalPC",DevComment="The PlayerState has no controller and the world has no local controller to use as a relay. Check player initialization and ownership.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.NoOwner",DevComment="The stored AutoReplication owner is no longer valid. Check the variable binding and whether the owner has been destroyed.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.NoOwnerActor",DevComment="The binding exists but does not resolve to an actor for network routing. Check the object assigned as the AutoReplication owner.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.NoRelayComponent",DevComment="The actor selected to carry the update has no AutoReplication RPC relay component. Check the owner or resolved PlayerController setup.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.NoWorld",DevComment="The PlayerState has no world from which to find a local relay controller. Check the timing of the send relative to initialization or teardown.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.RelayFailed",DevComment="The relay returned failure while dispatching the payload. Check the relay logs and owning connection for the specific reason.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.RelayFound",DevComment="The client found a relay component. The reported actor role and local ownership help explain whether the send can use that connection.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.ResolvedToPC",DevComment="The client routes PlayerState-owned changes through its PlayerController, which can carry RPCs on the owning connection.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.Reverted",DevComment="A failed client dispatch restored the previous value from the replication change shadow. The local edit did not remain applied.")
GameplayTagList=(Tag="GT.ObjectVariables.ClientSync.Sending",DevComment="The client has assembled a filtered batch for an AutoReplication entry and is about to dispatch it. This reports the attempt, before server receipt.")
GameplayTagList=(Tag="GT.ObjectVariables.HierarchyTraversal",DevComment="The list command walks the variable hierarchy below the selected root. Depth shows the nesting level and the identifier distinguishes variables with similar names.")
GameplayTagList=(Tag="GT.ObjectVariables.Lookup",DevComment="The lookup command resolves a display name or identifier within a root. Its result reports the variable's identity, parent, replication, and persistence.")
GameplayTagList=(Tag="GT.ObjectVariables.LookupFailed",DevComment="No variable within the selected root matched the display name or identifier. Check the root and use the exact identifier when names are ambiguous.")
GameplayTagList=(Tag="GT.ObjectVariables.No_Parent",DevComment="Parent relationship diagnostics from object-variable assets that still use this tag. Check the named variable and its expected root in the message.")
GameplayTagList=(Tag="GT.ObjectVariables.OrphanPolicy.Changed",DevComment="The orphan command switched the runtime rule for variables that lose their parent. Future orphans follow the new reparent or destroy policy.")
GameplayTagList=(Tag="GT.ObjectVariables.OrphanPolicy.Current",DevComment="The orphan command was queried without a new policy. The message reports how parentless variables are currently handled.")
GameplayTagList=(Tag="GT.ObjectVariables.OrphanPolicy.InvalidArgument",DevComment="The orphan command accepts reparent or destroy. An invalid argument leaves the current policy in place.")
GameplayTagList=(Tag="GT.ObjectVariables.OrphanPolicy.Unchanged",DevComment="The requested orphan policy already matches the active rule. Existing variable handling continues under that rule.")
GameplayTagList=(Tag="GT.ObjectVariables.Payload.CustomApplyFailed",DevComment="The receiving variable's custom apply hook did not accept the payload. Check both the writer and reader for the property.")
GameplayTagList=(Tag="GT.ObjectVariables.Payload.CustomSkipped",DevComment="The custom writer did not supply data, so the property was omitted from the outgoing payload. Check the handler when an update is expected.")
GameplayTagList=(Tag="GT.ObjectVariables.Payload.DeserializeFailed",DevComment="The receiver could not decode the serialized property. Check that both peers use compatible property declarations and serialization.")
GameplayTagList=(Tag="GT.ObjectVariables.Payload.SerializeFailed",DevComment="The sender could not encode this property for AutoReplication. Check its type, value, and serialization in the connection context.")
GameplayTagList=(Tag="GT.ObjectVariables.Payload.UnknownProperty",DevComment="The receiver has no replicated declaration matching this payload field, so it skips the field. Compare sender and receiver declarations.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.BaselineCaptured",DevComment="Memory is sampled before test variables are spawned. Compare it with later samples in the same run to estimate the workload's cost.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Cleanup.Completed",DevComment="Measures how long the benchmark took to remove its generated variables. This duration is reported separately from spawning and traversal.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Cleanup.Started",DevComment="The measured workload has finished and the benchmark is starting to remove its generated variables.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.DeepLookup.Completed",DevComment="Summarizes lookup samples by path depth and elapsed time. Use average and maximum depth when comparing runs with different hierarchies.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.DisplayNameLookup.Completed",DevComment="Measures both hit rate and elapsed time for sampled display-name queries. Compare against identifier lookup separately.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Harness.ClientConnecting",DevComment="The benchmark client has started connecting to the test server at the address in the message. Look for the handshake and join messages next.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Harness.Connected",DevComment="The benchmark has established its client and server connection. Replication timing can now use the harness connection.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Harness.GameInstanceAllocationFailed",DevComment="The harness could not allocate a GameInstance for the named endpoint. Check endpoint setup before using the network measurements.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Harness.GameInstanceMissing",DevComment="The named test endpoint has no GameInstance after setup. Check which endpoint initialized its world and ownership context.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Harness.GameModeInitialized",DevComment="Confirms which GameMode the benchmark server actually initialized. This helps verify the intended harness setup.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Harness.GameModeMismatch",DevComment="The test server started with a different GameMode than the harness expected. Check the level and URL GameMode selection.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Harness.JoinRequested",DevComment="The test server acknowledged the handshake and the client proceeded to request a join. This is earlier than completion of the harness connection.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Harness.ServerListening",DevComment="The test server has begun listening. The net driver and bound address help diagnose connection failures or results from an unexpected driver.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Harness.StatCaptureEnabled",DevComment="Automation enabled network statistic collection on the named endpoint's driver. Use the endpoint label to separate client and server observations.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Harness.StatCaptureRequested",DevComment="The headless harness requested network and Iris statistics. The results are intended for log-based inspection.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.HierarchyTraversal.Completed",DevComment="Reports the total entries visited and time taken to flatten the benchmark hierarchy across active roots.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.HierarchyTraversal.RootSummary",DevComment="Shows one root's contribution to the flattened result. Compare the counts when a root appears to be missing entries.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.HierarchyTraversal.Started",DevComment="The full traversal is starting. The number of active roots and expected entries provide a reference for the final count.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.IdentifierLookup.Completed",DevComment="Measures the elapsed time for the benchmark's identifier queries. Compare runs with the same number of lookups.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.IdentifierLookup.Started",DevComment="The benchmark is starting direct identifier queries. The sample size gives context for the elapsed time reported at completion.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.NetworkConfigurationApplied",DevComment="The selected network preset was applied to active net drivers. Use the preset when comparing results from different runs.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.NetworkConfigurationWarning",DevComment="The benchmark requested a network preset and recorded a driver warning. Read the warning before comparing these timings with a fully configured run.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.NetworkSimulationSummary",DevComment="Summarizes what the emulation observed for latency, drops, and deliveries. This measures the chosen simulation scenario.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.NetworkStimulusSummary",DevComment="Summarizes the property changes used to exercise benchmark replication. Use it to compare the workload that generated the network samples.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.NetworkValidationSummary",DevComment="Summarizes time spent checking replication state across benchmark samples. Activation timing is reported separately.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.NetworkingHelperMissing",DevComment="A benchmark node under a networking-enforced root lacks the instrumentation helper used to exercise that path. Check the node class used by the scenario.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.PacketSummary",DevComment="Counts serialized batches and participating instrumented variables from the benchmark. These counters measure serialization activity in the run.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.ReferenceHopping.Completed",DevComment="Reports success count, hop depth, and elapsed time for traversals through variable references. Compare chain lengths when interpreting the timings.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.References.Assigned",DevComment="The workload finished adding cross-variable links. The link count and density describe the graph used by later traversal samples.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.RegistryFootprint",DevComment="Measures combined memory attributed to the variable registries. Compare exclusive object memory and inclusive memory separately.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.RegistryMembership.Completed",DevComment="Reports the time spent checking whether sampled variables are present in the registry after creation.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.ReplicationActivationSummary",DevComment="Summarizes measured time spent activating replication on instrumented benchmark variables.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.ReplicationValidation.Completed",DevComment="Checks whether the expected variables ended up replicating. Enforced and optional failures are reported separately to distinguish configuration requirements.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.RootFootprint",DevComment="Breaks out memory use and variable count for one root. Use it to identify which root accounts for changes in the aggregate benchmark footprint.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.RootNetworkSummary",DevComment="Reports networking opt-ins, active instances, and violations for a single root. The enforcement flag determines whether disabled networking violates its policy.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.RootsActivated",DevComment="Records which root registries the scenario could activate. Interpret workload totals against the actual roots rather than the requested count alone.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Sample.IO",DevComment="Shows changes in available I/O counters between two samples of a named benchmark phase.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Sample.IOUnavailable",DevComment="The platform does not expose the I/O counters this phase needs. Other measurements can still be reported.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Sample.System",DevComment="Reports process and thread CPU readings and memory measurements around a benchmark phase. The timing fields give the CPU time sampled for that phase.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.ScenarioSummary",DevComment="Records the scenario and its workload settings before the run, providing context for comparing later summaries.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Spawn.BranchingSummary",DevComment="Describes actual tree shape and how often extra text payload was assigned. Both can change memory and traversal costs.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Spawn.Completed",DevComment="Reports elapsed time and count for actual variable creation. Compare with the requested count when a scenario produces fewer nodes than expected.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Spawn.RootSummary",DevComment="Shows how the created variables were distributed across roots. A skewed distribution can explain uneven traversal or memory samples.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.Spawn.Started",DevComment="Starts generating the benchmark hierarchy with a configured node count and maximum number of children per parent.")
GameplayTagList=(Tag="GT.ObjectVariables.Performance.SubtreeEnumeration.Completed",DevComment="Measures visits to selected subtrees. Use the average and largest subtree size to compare probes from different hierarchy shapes.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ApplyArgumentFailed",DevComment="The named argument could not be copied into the handler parameter. The native handler cannot run with incomplete parameter storage.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ArgumentOVClassMismatch",DevComment="The snapshot decoded into an object variable whose class the handler parameter cannot accept. Compare the declared parameter class with the sender's variable type.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ArgumentOVDeserializeFailed",DevComment="The receiver could not reconstruct the argument object variable from the incoming snapshot. Check accompanying snapshot, class, or ownership diagnostics.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ArgumentOVNoResultParent",DevComment="RPC argument reconstruction requires an available result parent to own the variable. Check result-root initialization if the parent is missing.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ArgumentOVVersionMismatch",DevComment="The incoming object-variable argument snapshot uses a different version than the receiver expects. Align the builds or snapshot serializers on both peers.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ArgumentStructMismatch",DevComment="The encoded struct and the handler parameter's declared struct do not match. Compare the struct definitions used to construct and bind the argument.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ArgumentTypeMismatch",DevComment="The stored argument type cannot be applied to the handler's reflected property. Check the sender's argument type against the handler signature.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.BindUnnamed",DevComment="No RPC handler name was supplied, so registration did not happen. Bind the same non-empty name used by the sender.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ExampleHandler",DevComment="The built-in example handler ran and received its label and numeric value. Use their values to check that named arguments were carried through dispatch.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ExecuteManual",DevComment="Manual networking is active for the variable. This automatic replication path cannot execute its RPC handlers.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.HandlerRegistered",DevComment="Associates a handler name and reliability policy with an object variable. Incoming calls must use the same registration.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.MissingHandler",DevComment="The received call has no handler name, so the receiver cannot resolve a handler. Check how the sender fills the RPC payload.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.MissingParam",DevComment="An expected handler parameter has no usable bytes in the payload. Check the supplied names against the signature and ensure the matching argument was serialized.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.NoBlueprintOverride",DevComment="The Blueprint fallback received a call but the variable has no override to handle it. Bind a native handler or implement the Blueprint event.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.NoNativeHandler",DevComment="No matching native handler was found. The receiver forwards the call to the Blueprint fallback event.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ReliabilityMismatch",DevComment="The receiver rejected the call because its delivery mode differs from the registered handler. Keep the requested and registered reliability settings aligned.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ResultNoOwner",DevComment="The RPC result container has no AutoReplication owner. The result may exist locally without being sent over the network.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.ResultReconstructFailed",DevComment="The response was received but its result object could not be rebuilt. Inspect the request identifier and the preceding snapshot diagnostics.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.SnapshotCaptureFailed",DevComment="The result object could not be serialized into a response snapshot. Check its class and the fields included in the result.")
GameplayTagList=(Tag="GT.ObjectVariables.RPC.SnapshotVersionMismatch",DevComment="The received result snapshot format differs from the decoder's expected version. Verify the peers use compatible builds.")
GameplayTagList=(Tag="GT.ObjectVariables.Registration.Invalid_Class",DevComment="Registration requires a valid object-variable class. Check the class input or asset reference at the call site.")
GameplayTagList=(Tag="GT.ObjectVariables.Registration.No_Parent",DevComment="No explicit parent was supplied, so the resolved root is used. Supply a parent when the variable should be registered inside a specific subtree.")
GameplayTagList=(Tag="GT.ObjectVariables.Registration.Successful",DevComment="The variable has joined the hierarchy. Use the identifier and parent reported here to distinguish it from other instances with the same display name.")
GameplayTagList=(Tag="GT.ObjectVariables.Registration.Transactional",DevComment="Created an editor-transactional variable under the reported parent. Its transactional flag allows it to participate in undo and redo.")
GameplayTagList=(Tag="GT.ObjectVariables.Registration.UniqueCollision",DevComment="The variable's uniqueness rules prevented registration because a matching instance already exists. Look up the existing variable before creating another one.")
GameplayTagList=(Tag="GT.ObjectVariables.Registry.Cleaned",DevComment="The registry finished a consistency scan. The result distinguishes a scan that removed dangling entries from one that found none.")
GameplayTagList=(Tag="GT.ObjectVariables.Registry.FullCleanup.Reparented",DevComment="Full cleanup moved a surviving root outside its former outer chain. Use the reported new outer to review lifetime during teardown.")
GameplayTagList=(Tag="GT.ObjectVariables.Registry.FullCleanup.ReparentingToTransient",DevComment="Full cleanup is moving a root from its current outer into the transient package. The pre-move chain identifies what it was tied to.")
GameplayTagList=(Tag="GT.ObjectVariables.Registry.FullCleanup.RootUnrooted",DevComment="Full cleanup removed a root's explicit garbage-collection protection. Any remaining strong references still determine its lifetime.")
GameplayTagList=(Tag="GT.ObjectVariables.Registry.Invalid_Ptr",DevComment="Registry reference diagnostics from assets using this tag. Inspect the reported variable and the lifecycle of its owning root.")
GameplayTagList=(Tag="GT.ObjectVariables.Registry.RootUnrooted",DevComment="Removal of a root registry entry cleared the root's explicit garbage-collection protection. The key and outer chain identify the affected registry.")
GameplayTagList=(Tag="GT.ObjectVariables.Registry.VariableUnrooted",DevComment="Removal of an individual variable from its registry cleared its explicit garbage-collection protection. Check the reported outer chain if the variable remains alive.")
GameplayTagList=(Tag="GT.ObjectVariables.RepNotify.SignatureMismatch",DevComment="The notification parameter cannot accept the replicated property's old value. The notification path continues without passing that value.")
GameplayTagList=(Tag="GT.ObjectVariables.Replication.ActivationGuard",DevComment="RPC handler binding must run during the variable's OnReplicationActivated callback. Move the binding into that callback.")
GameplayTagList=(Tag="GT.ObjectVariables.Replication.AlreadyActive",DevComment="A second activation attempt arrived while activation was already in progress. Check for reentrant calls from the activation callback.")
GameplayTagList=(Tag="GT.ObjectVariables.Replication.Disabled",DevComment="Activation stopped because this variable does not support networking. Check the class and root networking settings.")
GameplayTagList=(Tag="GT.ObjectVariables.Replication.DisabledSupport",DevComment="A request to enable replication was ignored because networking support is disabled for this variable. Enable support before requesting replication.")
GameplayTagList=(Tag="GT.ObjectVariables.Replication.PropertyMissing",DevComment="The requested field was not found by reflection on this variable's class. Check the field name on the actual class being registered.")
GameplayTagList=(Tag="GT.ObjectVariables.Replication.PropertyRegistered",DevComment="The field has a replication declaration. Its condition and the recipient's access policy still determine when it is sent.")
GameplayTagList=(Tag="GT.ObjectVariables.Replication.PropertyUnnamed",DevComment="No field name was supplied to property registration. Provide the name of a reflected property on the variable class.")
GameplayTagList=(Tag="GT.ObjectVariables.Replication.RepNotifyMissing",DevComment="The requested notification function does not exist on the class. The property is registered for replication with notifications disabled.")
GameplayTagList=(Tag="GT.ObjectVariables.Root",DevComment="Marks the root being visited by the hierarchy listing. The following entries belong to this root.")
GameplayTagList=(Tag="GT.ObjectVariables.Root.CreationBlockedDuringTeardown",DevComment="The root lookup is running during teardown. It can return an existing root but will not allocate another one.")
GameplayTagList=(Tag="GT.ObjectVariables.Root.GetOrCreateBlockedDuringTeardown",DevComment="The internal root accessor stopped before allocation because teardown is in progress. Avoid starting new registry work during shutdown.")
GameplayTagList=(Tag="GT.ObjectVariables.Root.OrphanReparentingUnsupported",DevComment="The root's policy prevents it from accepting the orphan. The variable is destroyed instead of being attached to that root.")
