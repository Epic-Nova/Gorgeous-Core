GameplayTagList=(Tag="GT.ObjectVariables.ServerSync.BuildPayloadFailed",DevComment="The server skipped this client because it could not build its connection-specific payload. Inspect preceding serialization or connection diagnostics.")
GameplayTagList=(Tag="GT.ObjectVariables.ServerSync.NoRelayComponent",DevComment="The target PlayerController lacks the RPC relay used for property updates. Check the controller class or component setup.")
GameplayTagList=(Tag="GT.ObjectVariables.ServerSync.PropertyAccessDenied",DevComment="The per-property policy excluded this field from the named client's payload. The client may still receive other fields from the same variable.")
GameplayTagList=(Tag="GT.ObjectVariables.ServerSync.Replicated",DevComment="Counts property updates accepted by the relay and the client connections it dispatched them to. These totals describe dispatch rather than client application.")
GameplayTagList=(Tag="GT.ObjectVariables.Stats",DevComment="The stats command reports counts by persistence, AutoReplication eligibility, active replication, and legacy registration for the selected root or subtree.")
GameplayTagList=(Tag="GT.ObjectVariables.Stats.LookupFailed",DevComment="The requested subtree could not be resolved inside the root, so the stats command did not collect counts. Check the display name or identifier.")
GameplayTagList=(Tag="GT.ObjectVariables.Stats.NoVariables",DevComment="The selected stats scope had no variables to count. Check that the relevant root or subtree is populated.")
GameplayTagList=(Tag="GT.ObjectVariables.Transactional.Failed",DevComment="The transactional variable could not be created under the resolved parent. Inspect the requested class, parent, and creation diagnostics.")
GameplayTagList=(Tag="GT.ObjectVariables.Transactional.Invalid_Class",DevComment="The transactional creation request has no valid object-variable class. Check the editor tool's selected class before retrying.")
GameplayTagList=(Tag="GT.ObjectVariables.Transactional.No_Parent",DevComment="Transactional creation received no parent, so it uses the resolved root. Supply a parent to place the variable in a specific subtree.")
GameplayTagList=(Tag="GT.ObjectVariables.Transactional.Success",DevComment="Reports successful transactional object-variable creation from assets using this tag. Use the attached instance and parent information to locate the result.")
